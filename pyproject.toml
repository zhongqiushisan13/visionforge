[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionforge"
version = "1.1.2"
description = "DeepSeek 编剧 + ComfyUI/LoRA 关键帧 + MiniMax H3 镜头 + ffmpeg 剪辑的桌面级 AI 视频编导台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VisionForge contributors" }]
keywords = ["ai-video", "deepseek", "minimax", "comfyui", "ffmpeg", "video-editing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pywebview>=5.0",
    "imageio-ffmpeg>=0.5.1",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "pyinstaller>=6.6"]
build = ["pyinstaller>=6.6"]

[project.scripts]
visionforge = "videoforge.desktop:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["videoforge*"]

[tool.setuptools.package-data]
"videoforge.web" = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 只查语法错误与未定义名，不搞风格警察
select = ["E9", "F63", "F7", "F82"]
