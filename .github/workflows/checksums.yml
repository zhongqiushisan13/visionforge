name: Checksums

# Release 发布后自动给资产生成 SHA256SUMS.txt 并挂回同一个 Release。
# 之所以在 CI 里算：本机走代理拉 58MB 要一小时，runner 上是秒级。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补校验文件的 Release tag（例如 v1.1.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sha256:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 下载该 Release 的 zip 资产
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir staging
          ls -lh staging

      - name: 计算 SHA256
        run: |
          set -euo pipefail
          cd staging
          sha256sum *.zip | tee SHA256SUMS.txt
          echo "---"
          echo "共 $(wc -l < SHA256SUMS.txt) 个文件"

      - name: 上传到同一 Release
        run: |
          set -euo pipefail
          gh release upload "$TAG" staging/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
