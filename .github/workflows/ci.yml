name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 核心依赖即可跑单测；桌面壳（pywebview）不参与 CI
      # httpx：starlette 的 TestClient 必须要一个 HTTP 客户端，缺了 test_security_budget 会整模块导入失败
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fastapi "uvicorn[standard]" imageio-ffmpeg edge-tts httpx ruff

      - name: Compile check
        run: python -m compileall -q videoforge tools tests

      - name: Lint (errors only)
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Unit tests
        run: python -m unittest discover -s tests -v
